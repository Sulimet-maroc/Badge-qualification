<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sulimet · Badges de qualification</title>
<style>
/* Look: "Corporate Fluent" (same as the Sulimet CV tool, style C). Soft drifting colour background,
   frosted-glass panels, Microsoft 365 blue for actions. Badge cards below are NOT restyled. */
:root{
  --bg:#eef2f8; --surface:rgba(255,255,255,.66); --solid:#fff; --fill:rgba(255,255,255,.55); --fill2:rgba(225,232,243,.9);
  --ink:#1b1a19; --muted:#5f5e5c; --dim:#a19f9d; --line:rgba(0,0,0,.06); --line2:rgba(0,0,0,.12);
  --blue:#0f6cbd; --blue2:#115ea3; --bluesoft:rgba(15,108,189,.1);
  --ok:#107c10; --oksoft:rgba(16,124,16,.1); --pot:#bc4b09; --potsoft:rgba(202,80,16,.12); --no:#c50f1f; --nosoft:rgba(197,15,31,.09);
  --f-body:"Segoe UI Variable Text","Segoe UI","Open Sans",sans-serif;
  --f-disp:"Segoe UI Variable Display","Segoe UI","Open Sans",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(30,60,120,.05),0 10px 30px rgba(30,60,120,.07);
  --red:#C00000; --line-b:#A33A00;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* living background */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;display:block;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.6;will-change:transform}
.aurora i:nth-child(1){background:#b7d0ff;left:-18vmax;top:-22vmax;animation:drift1 34s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:#ffc8d0;right:-20vmax;top:-18vmax;animation:drift2 41s ease-in-out infinite alternate}
.aurora i:nth-child(3){background:#bff0dc;left:20vmax;bottom:-30vmax;animation:drift3 47s ease-in-out infinite alternate}
.aurora i:nth-child(4){background:#ddd2ff;right:5vmax;bottom:-26vmax;width:48vmax;height:48vmax;animation:drift4 53s ease-in-out infinite alternate}
@keyframes drift1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18vmax,10vmax) scale(1.12)}100%{transform:translate(8vmax,22vmax) scale(.95)}}
@keyframes drift2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-16vmax,14vmax) scale(.92)}100%{transform:translate(-26vmax,4vmax) scale(1.1)}}
@keyframes drift3{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-14vmax,-12vmax) scale(1.15)}100%{transform:translate(12vmax,-20vmax) scale(1)}}
@keyframes drift4{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-20vmax,-8vmax) scale(1.08)}100%{transform:translate(-6vmax,-18vmax) scale(.9)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}

header.top,main,#terrain{position:relative;z-index:1}
main{max-width:1180px;margin:0 auto;padding:0 16px 56px}

/* header */
header.top{max-width:1180px;margin:0 auto;padding:22px 16px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:30px;height:36px;flex:none;filter:drop-shadow(0 2px 6px rgba(225,0,18,.25))}
.brand h1{margin:0;font-family:var(--f-disp);font-weight:600;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:13px;color:var(--muted)}
.tblock{display:none}

/* frosted panels */
section.panel{background:var(--surface);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
h2{margin:0 0 6px;font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.hint b{color:var(--ink);font-weight:600}

/* fields + buttons (Fluent) */
input,select,textarea{background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.1);border-bottom-color:rgba(0,0,0,.35);border-radius:6px;padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-bottom:2px solid var(--blue)}
textarea{width:100%;min-height:120px;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;resize:vertical}
button{border:0;border-radius:6px;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.1);padding:8px 15px;font-weight:500;font-size:14px;transition:background .15s}
button:hover{background:#fff}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--blue);color:#fff;box-shadow:none;font-weight:600;padding:9px 18px}
button.main:hover{background:var(--blue2)}
button.sm{padding:3px 10px;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.row label b{color:var(--ink);font-weight:600}
.row label select,.row label input{color:var(--ink)}

/* people list */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
thead th{font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line2)}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.55)}
tbody td:first-child{font-variant-numeric:tabular-nums;color:var(--muted);position:relative;padding-left:16px}
tbody td:first-child::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--wire,transparent)}
tbody tr.okr{--wire:var(--ok)} tbody tr.badr{--wire:var(--no)}
tbody td:nth-child(2){font-weight:600}
td select{padding:5px 8px;font-size:14px}
.postes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ok{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:var(--ok);border-radius:4px;padding:2px 8px}
.err{display:inline-block;font-size:12px;font-weight:600;color:var(--no);background:transparent;box-shadow:inset 0 0 0 1px rgba(197,15,31,.5);border-radius:4px;padding:2px 8px}
p.hint .err,p.hint .ok,#pdfMsg .err,#pdfMsg .ok,#sendOut .err{box-shadow:none;background:none;padding:0;font-size:13px}
#pdfMsg .ok,p.hint .ok{color:var(--ok)}
#status:empty,#pdfMsg:empty{display:none}
#status{font-size:13.5px;color:var(--ink);background:var(--bluesoft);border-radius:6px;padding:7px 12px}
.ic{width:18px;height:18px;flex:none;vertical-align:-4px;margin-right:7px}
button{display:inline-flex;align-items:center;justify-content:center}
.out{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.outhead{font-size:13px;font-weight:600;color:var(--muted)}
.outbtns{margin:8px 0 0}
button.wab{color:var(--ok)} button.wab:hover{background:var(--oksoft)}
button.mxb{background:var(--ink);color:#fff;box-shadow:none} button.mxb:hover{background:#333}
.mxfile{margin:2px 0 0;font-size:12.5px}.mxfile a{color:var(--blue);cursor:pointer}
button.mailb{color:var(--blue)} button.mailb:hover{background:var(--bluesoft)}
/* iPhone zooms on fields under 16px: keep them at 16px on phones */
@media screen and (max-width:700px){ input,select,textarea,td select{font-size:16px!important} }
@media screen and (max-width:700px){ .row.outbtns button{flex:1 1 100%!important;justify-content:flex-start;padding:12px 16px} }
.plabel{font-size:12.5px;font-weight:600;color:var(--muted);margin:4px 0 8px;text-align:center}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px;border:1.5px dashed rgba(15,108,189,.35);border-radius:var(--r)}

/* ---------- Cards: 8 per A4 (2 x 4) ---------- */
.page{display:grid;grid-template-columns:repeat(2,96mm);grid-auto-rows:68mm;gap:2mm;justify-content:center;margin:0 auto 6mm}
/* Badge IQ-RH-179 — rounded look: same layout, Sulimet logo instead of the T */
.badge{width:96mm;height:68mm;box-sizing:border-box;border:.45mm solid #2b2f36;border-radius:3.2mm;background:#fff;padding:2.4mm 2.6mm 1.4mm;display:flex;flex-direction:column;position:relative;font-family:"Inter Tight","Segoe UI",Arial,sans-serif;color:#1b1f24;overflow:hidden}
.n-top{display:flex;gap:3.4mm;height:19.5mm;flex:none}
.n-photo{width:15.5mm;height:19mm;border:.35mm solid #c9cdd3;border-radius:1.8mm;background:#f4f5f7;display:grid;place-items:center;flex:none;overflow:hidden}
.n-photo span{font-size:4.6pt;letter-spacing:.3mm;color:#a6abb3;font-weight:600}
.n-photo img{width:100%;height:100%;object-fit:cover;display:block}
.n-id{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:.4mm 0;min-width:0}
.n-f{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.n-l{font-size:5.2pt;font-weight:600;letter-spacing:.25mm;text-transform:uppercase;color:#c8102e}
.n-v{font-size:9pt;font-weight:700;margin-top:.3mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-v.mono{font-variant-numeric:tabular-nums;letter-spacing:.15mm}
.n-logo{width:5mm;height:6mm;flex:none;margin-top:.2mm}
.n-logo svg{width:100%;height:100%;display:block}
.n-line{height:.5mm;border-radius:.3mm;background:#a33a00;margin:1.8mm 0 1.2mm;flex:none}
.n-leg{display:flex;gap:4.5mm;align-items:center;font-size:6pt;font-weight:600;color:#4a5059;flex:none}
.n-leg span{display:flex;align-items:center;gap:1.2mm}
.n-band{flex:none;margin:1.6mm -2.6mm 0;height:5.2mm;background:#ffc000;color:#1b1f24;display:flex;align-items:center;justify-content:center;font-size:8.4pt;font-weight:700;letter-spacing:.45mm;text-transform:uppercase}
.badge.form .n-line{margin-top:1.4mm}
.n-leg b{margin-left:auto;font-size:6.2pt;letter-spacing:.3mm;color:#fff;background:#2b2f36;border-radius:1mm;padding:.3mm 1.6mm}
.n-rows{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding-bottom:2.2mm}
.n-grid{display:grid;column-gap:.6mm}
.n-item{display:flex;flex-direction:column;align-items:center;gap:.55mm;border-radius:1.2mm;padding:.5mm 0 .8mm;min-width:0}
.n-item.on{background:#f1f2f4}
.n-lab{font-size:5.6pt;font-weight:600;line-height:1.05;text-align:center;white-space:pre-line;min-height:2.6mm;color:#2b2f36}
.n-item.on .n-lab{color:#000;font-weight:700}
.n-sq{width:2.8mm;height:2.8mm;box-sizing:border-box;border:.35mm solid #2b2f36;border-radius:.6mm;position:relative;background:#fff;flex:none}
.n-sq.on::before,.n-sq.on::after{content:"";position:absolute;left:50%;top:50%;width:3.1mm;height:.45mm;border-radius:.2mm;background:#000}
.n-sq.on::before{transform:translate(-50%,-50%) rotate(45deg)}
.n-sq.on::after{transform:translate(-50%,-50%) rotate(-45deg)}
.n-ci{width:2.9mm;height:2.9mm;box-sizing:border-box;border:.35mm solid #2b2f36;border-radius:50%;background:#fff;flex:none}
.n-ci.on{background:#000;border-color:#000}
.n-ref{position:absolute;right:2.8mm;bottom:1.2mm;font-size:4.4pt;color:#8a9099;font-weight:500}

/* ---------- Terrain (phone) view ---------- */
#terrain{display:none;max-width:560px;margin:0 auto;padding:0 0 90px}
body.t-mode header, body.t-mode main{display:none}
body.t-mode #terrain{display:block}
.t-head{background:var(--surface);color:var(--ink);padding:12px 16px;position:sticky;top:0;z-index:2;border-bottom:1.5px solid var(--ink);box-shadow:inset 0 -5px 0 var(--w-red)}
.t-head h1{margin:0;font-family:var(--f-disp);font-size:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.t-head p{margin:3px 0 0;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.t-card{background:var(--surface);margin:10px 10px 0;border-radius:var(--r);border:1px solid var(--line2);padding:10px 12px 10px 18px;position:relative;box-shadow:inset 6px 0 0 var(--fill2)}
.t-card.done{box-shadow:inset 6px 0 0 var(--w-green)}
.t-who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-who b{font-family:var(--f-disp);font-size:19px;font-weight:700;letter-spacing:.02em}
.t-who span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.t-lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.t-btns{display:flex;flex-wrap:wrap;gap:6px}
.t-btns button{padding:9px 12px;font-size:15px;border-radius:2px;border:1px solid var(--line2);background:var(--surface);min-width:52px;font-family:var(--f-mono);font-weight:500}
.t-btns button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.t-btns.proj button{font-family:var(--f-disp);font-size:16px;font-weight:700;letter-spacing:.04em}
.t-btns.proj button.on{background:var(--w-red);border-color:var(--w-red)}
.t-foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--ink);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:center}
.t-foot button{background:var(--w-green);border:0;color:#fff;font-family:var(--f-disp);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:17px;padding:12px 18px;border-radius:var(--r)}
.t-foot small{color:var(--muted);font-family:var(--f-mono)}
.linkbox{width:100%;font-family:var(--f-mono);font-size:12px;margin-top:6px}
.sendrow{background:var(--oksoft);border:1px solid var(--line2);border-left:5px solid var(--w-green);border-radius:2px;padding:8px 12px}
button.wa{background:var(--w-green);border-color:var(--w-green);color:#fff;font-family:var(--f-disp);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
button.wa:hover{background:#17703d;border-color:#17703d}

/* ---------- Phone screen ---------- */
@media screen and (max-width:700px){
  main{padding:8px}
  section.panel{padding:12px}

  .row label{width:100%;flex-direction:column;align-items:stretch;gap:4px}
  .row label select,.row label input{width:100%;margin-top:3px}
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%!important}
  table{border:0}
  tr{margin-bottom:8px}
  tbody td:first-child{padding-left:4px}
  td{border:0;padding:3px 4px}
  td:nth-child(1),td:nth-child(2){display:inline-block;width:auto!important;font-weight:bold}
  td select{font-size:15px;padding:7px}
  .row button{flex:1;padding:12px;font-size:15px}
  #cards .page{grid-template-columns:1fr;grid-auto-rows:auto;gap:12px;justify-items:center;margin-bottom:18px}
  #cards .badge{box-shadow:0 2px 10px rgba(30,60,120,.12)}
}
/* ---------- Fluent overrides ---------- */
.typebox{background:rgba(16,124,16,.12)!important;border:1px solid rgba(16,124,16,.18)!important;border-radius:8px!important;padding:6px 12px!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .2s,border-color .2s}
.typebox.form{background:rgba(242,183,5,.18)!important;border-color:rgba(242,183,5,.35)!important}
.sendrow{background:none!important;border:0!important;padding:0!important}
button.wa{background:var(--ok)!important;color:#fff!important;box-shadow:none!important;font-family:var(--f-body)!important;font-size:14px!important;font-weight:600!important;letter-spacing:0!important;text-transform:none!important}
button.wa:hover{background:#0e6b0e!important}
.linkbox{font-family:Consolas,monospace!important}
.t-head{background:rgba(255,255,255,.72)!important;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-bottom:1px solid var(--line)!important;box-shadow:none!important;color:var(--ink)!important}
.t-head h1{font-family:var(--f-disp)!important;font-size:20px!important;font-weight:600!important;letter-spacing:-.01em!important;text-transform:none!important}
.t-head p{font-family:var(--f-body)!important;font-size:13px!important;color:var(--muted)!important}
.t-card{background:var(--surface)!important;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.75)!important;border-radius:var(--r)!important;box-shadow:var(--shadow)!important;padding:12px 14px!important}
.t-card.done{box-shadow:inset 3px 0 0 var(--ok),var(--shadow)!important}
.t-who b{font-family:var(--f-disp)!important;font-size:17px!important;font-weight:600!important}
.t-who span{font-family:var(--f-body)!important;font-size:13px!important}
.t-lab{font-family:var(--f-body)!important;font-size:12.5px!important;letter-spacing:0!important;text-transform:none!important;font-weight:600}
.t-btns button{border-radius:999px!important;border:0!important;background:rgba(255,255,255,.85)!important;box-shadow:0 0 0 1px rgba(0,0,0,.1)!important;font-family:var(--f-body)!important;font-weight:500!important;padding:8px 14px!important}
.t-btns button.on{background:var(--blue)!important;color:#fff!important;box-shadow:none!important}
.t-btns.proj button{font-weight:600!important;letter-spacing:0!important}
.t-btns.proj button.on{background:var(--ink)!important}
.t-foot{background:rgba(255,255,255,.8)!important;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line)!important}
.t-foot button{background:var(--ok)!important;font-family:var(--f-body)!important;font-weight:600!important;letter-spacing:0!important;text-transform:none!important;font-size:16px!important;border-radius:8px!important;box-shadow:none!important}
.t-foot small{font-family:var(--f-body)!important}
@media screen and (max-width:700px){
  header.top{padding:14px 12px 10px}
  table{border:0}
  tr{background:var(--surface)!important;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.75)!important;border-radius:var(--r)!important;box-shadow:var(--shadow)!important;padding:8px 8px 8px 14px!important}
  tbody td:first-child::before{display:none}
  tr.okr{box-shadow:inset 3px 0 0 var(--ok),var(--shadow)!important} tr.badr{box-shadow:inset 3px 0 0 var(--no),var(--shadow)!important}
  .row label{color:var(--muted)}
}
@media print{
  @page{size:A4 portrait;margin:6mm}
  body{background:#fff;background-image:none}
  html{background:#fff}
  header,section.panel:not(.printme),.noprint{display:none!important}
  main{padding:0;max-width:none}
  section.printme{border:0;padding:0;margin:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .aurora{display:none}
  .page{margin:0;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 100 120" aria-label="Sulimet">
      <defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3a4c"/><stop offset=".55" stop-color="#e10012"/><stop offset="1" stop-color="#b8000e"/></linearGradient></defs>
      <path fill="url(#lg1)" d="M50 10 L93.3 35 L93.3 59 L50 34 L39.6 40 L93.3 71 L93.3 85 L50 110 L6.7 85 L6.7 61 L50 86 L60.4 80 L6.7 49 L6.7 35 Z"/>
      <path fill="rgba(255,255,255,.14)" d="M50 10 L6.7 35 L6.7 49 L39.6 40 L50 34 Z"/>
    </svg>
    <div><h1>Sulimet</h1><small>Badges de qualification</small></div>
  </div>
  <div class="tblock" aria-label="Cartouche">
    <div><span>Document</span><b>IQ-RH-179</b></div>
    <div><span>Personnes</span><b id="tbN">0</b></div>
    <div><span>Badges prêts</span><b id="tbOk">0</b></div>
    <div><span>Date</span><b id="tbDate"></b></div>
  </div>
</header>
<main>

<section class="panel">
  <h2>1. Coller Matricule + Nom</h2>
  <textarea id="paste" placeholder="4621	EL JEBBARI MOHAMED&#10;3506	AMAHROUCH F.ZAHRAE&#10;5073	RAFIK EZZARFI" oninput="buildList()"></textarea>
  <div class="row">

<script>
// Codes copied from CARTS.xlsx (IQ-RH-179). Order = order on the card.
const CARDS = {
  "VALEO": { ref:"IQ-RH-179/6", cols:12, rows:[
    ["STO","INS","BAN","ELE","VIS","ATO","VAC","DIS","REC","WEL","T.CLIP","ACC"],
    ["FOA","MEC","KOS","TPM","ERN","PSP","ARB","BOLT","OND","SF-PR","GAB"] ]},
  "P2": { ref:"IQ-RH-179/6", cols:11, rows:[
    ["DEN","FER","ACC","ARO","SOL","RAY","STRU","TWI","MEC","M200","SHFR"],
    ["JONT","LUM","DS20","PS","WP","TPM","SF-PR"] ]},
  "P1": { ref:"IQ-RH-179/7", cols:11, rows:[
    ["KOM\nCRM","KOM\nCMP","SCH\nCRM","SCH\nCUT","APP\nWIN","APP\nHMI","APP\nESY","TUB\nCUT","PRC\nSP","PRC\nTPM","PRC\nSR"] ]}
  ,"JST": { ref:"IQ-RH-179/4", cols:10, rows:[
    ["K477","FET","INS","BT288","ENR","DM15","ELE","VIS","MLAB","PSP"],
    ["S/E","TPM","SF-PR"] ]}
};
const PER_PAGE = 8;
// Trainings that come automatically with some stations (from the Training Center TAC list).
// station code -> training codes added on the same card. Trainings are NOT stations (not in the matrix).
const TRAININGS = {
  "VALEO": [ { with:["MEC","ELE"],         add:["TPM","PSP"] } ],
  "P2":    [ { with:["MEC","LUM","TWI"],   add:["TPM"] } ],
  "JST":   [ { with:["DM15","ELE","K477"], add:["TPM","PSP"] },
             { with:["FET","S/E"],         add:["SF-PR"] } ]
};
const TRAINING_CODES=new Set(["TPM","PSP","SF-PR"]);
// index list of trainings to add for a station index on a card
function trainingsFor(proj, j){
  const rules=TRAININGS[proj], card=CARDS[proj]; if(!rules||!card) return [];
  const all=card.rows.flat().map(c=>label(c)), out=[];
  rules.forEach(t=>{ if(t.with.includes(all[j])) t.add.forEach(code=>{ const x=all.indexOf(code); if(x>=0&&!out.includes(x)) out.push(x); }); });
  return out;
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label=c=>c.replace("\n"," ");
const projOpts=sel=>`<option value="">—</option>`+Object.keys(CARDS).map(k=>`<option ${k===sel?"selected":""}>${k}</option>`).join("");
document.getElementById("defProj").innerHTML+=Object.keys(CARDS).map(k=>`<option>${k}</option>`).join("");

let ppl=[];
const saved={};   // per matricule: {proj, postes:[]} — kept if you paste again

function parseDate(s){ const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
const fmt=d=>d?`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`:"";

function buildList(){
  const def=parseDate(document.getElementById("defDate").value), dp=document.getElementById("defProj").value;
  const lines=document.getElementById("paste").value.split(/\r?\n/).filter(l=>l.trim());
  // Retour terrain header: "#BADGES Q 2027-10-23"
  const h=lines.find(l=>/^#BADGES\b/i.test(l.trim()));
  if(h){ const m=h.trim().split(/\s+/); if(m[1]==="Q"||m[1]==="F"){ if(document.getElementById("ctype").value!==m[1]){document.getElementById("ctype").value=m[1];} }
         if(/^\d{4}-\d{2}-\d{2}$/.test(m[2]||"") && document.getElementById("defDate").value!==m[2]){ document.getElementById("defDate").value=m[2]; return buildList(); } }
  const def2=parseDate(document.getElementById("defDate").value);
  ppl=lines.filter(l=>!/^#BADGES\b/i.test(l.trim()) && !/^retour terrain/i.test(l.trim())).map((l,idx)=>{
    if(l.includes("|")){                       // line from the phone: mat | nom | projet | codes
      const c=l.split("|").map(x=>x.trim());
      const mat=c[0]||"", proj=(c[2]||"").toUpperCase(), card=CARDS[proj];
      const idxs=card? codesToIdx(card,c[3]||"") : [];
      saved[mat]={proj:card?proj:"", postes: idxs.length? idxs.map(String) : [""]};
      return {idx, mat, nom:(c[1]||"").toUpperCase(), date:def2, s:saved[mat]};
    }
    let c=l.split("\t").map(x=>x.trim());
    if(c.length===1){ const m=c[0].match(/^(\S+)\s+(.+)$/); c=m?[m[1],m[2]]:[c[0],""]; }   // pasted without tab
    const mat=c[0]||"";
    if(!saved[mat]) saved[mat]={proj:dp, postes:[""]};
    return {idx, mat, nom:c.slice(1).filter(Boolean).join(" ").replace(/\s+/g," ").trim().toUpperCase(), date:def, s:saved[mat]};
  });
  drawTable(); renderCards();
}
const keyc=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function codesToIdx(card,txt){ const all=card.rows.flat().map(keyc);
  return String(txt).split(/[,;+]+/).map(keyc).filter(Boolean).map(k=>all.indexOf(k)).filter(i=>i>=0); }
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));

// Online address of this tool (to fill once it is on GitHub Pages)
const ONLINE_URL = "https://sulimet-maroc.github.io/Badge-qualification/";
function toolUrl(){ return /^https?:/.test(location.protocol) ? location.origin+location.pathname : ONLINE_URL; }

function sendToField(){
  const out=document.getElementById("sendOut");
  if(!ppl.length){ out.innerHTML='<p class="err">Collez d\'abord la liste (Matricule + Nom).</p>'; return; }
  const base=toolUrl();
  if(!base){ out.innerHTML='<p class="err">L\'outil doit d\'abord être mis en ligne (GitHub Pages) pour être ouvert sur un téléphone.</p>'; return; }
  const data={t:document.getElementById("ctype").value, d:document.getElementById("defDate").value,
    p:ppl.map(p=>[p.mat,p.nom,p.s.proj||"",p.s.postes.filter(Boolean).map(Number)])};
  const link=base+"#t="+b64e(data);
  const msg="Liste terrain ("+ppl.length+" personnes) — ouvrir, choisir projet + poste, puis Renvoyer :\n"+link;
  out.innerHTML=`<p class="hint" style="margin:8px 0 0">Lien prêt. Si WhatsApp ne s'ouvre pas, copiez-le :</p><input class="linkbox" readonly value="${esc(link)}" onclick="this.select()">`;
  try{ navigator.clipboard && navigator.clipboard.writeText(link).catch(()=>{}); }catch(e){}
  window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}

// ---------- Phone view ----------
let T=null, TKEY="";
function startTerrain(){
  const m=location.hash.match(/^#t=(.+)$/); if(!m) return false;
  try{ T=b64d(m[1]); }catch(e){ document.body.innerHTML='<p style="padding:20px">Lien invalide ou incomplet. Demandez un nouveau lien.</p>'; return true; }
  TKEY="terrain_"+m[1].slice(0,40)+m[1].length;
  try{ const s=JSON.parse(localStorage.getItem(TKEY)); if(s&&s.p&&s.p.length===T.p.length) T=s; }catch(e){}
  document.body.classList.add("t-mode"); drawTerrain(); return true;
}
function tSave(){ try{ localStorage.setItem(TKEY,JSON.stringify(T)); }catch(e){} }
function tProj(i,v){ const r=T.p[i]; if(r[2]!==v){ r[2]=v; r[3]=[]; } tSave(); drawTerrain(); }
function tCode(i,j){ const r=T.p[i], k=r[3].indexOf(j); if(k>=0) r[3].splice(k,1); else { r[3].push(j); trainingsFor(r[2],j).forEach(t=>{ if(!r[3].includes(t)) r[3].push(t); }); } tSave(); drawTerrain(); }
function drawTerrain(){
  const done=T.p.filter(r=>r[2]&&r[3].length).length;
  document.getElementById("terrain").innerHTML=`
   <div class="t-head"><h1>Liste terrain</h1><p>${done} / ${T.p.length} faits — choisir le projet, puis le(s) poste(s)</p></div>`+
   T.p.map((r,i)=>{ const card=CARDS[r[2]];
     return `<div class="t-card ${r[2]&&r[3].length?"done":""}">
      <div class="t-who"><b>${esc(r[1])}</b><span>${esc(r[0])}</span></div>
      <div class="t-lab">Projet</div>
      <div class="t-btns proj">${Object.keys(CARDS).map(k=>`<button class="${k===r[2]?"on":""}" onclick="tProj(${i},'${k}')">${k}</button>`).join("")}</div>
      ${card?`<div class="t-lab">Poste(s)</div><div class="t-btns">${card.rows.flat().map((c,j)=>`<button class="${r[3].includes(j)?"on":""}" onclick="tCode(${i},${j})">${esc(label(c))}</button>`).join("")}</div>`:""}
     </div>`}).join("")+
   `<div class="t-foot"><button onclick="sendBack()">Renvoyer sur WhatsApp</button><small>${done}/${T.p.length}</small></div>`;
}
function sendBack(){
  const lines=T.p.map(r=>{ const card=CARDS[r[2]];
    return [r[0],r[1],r[2]||"",card? r[3].slice().sort((a,b)=>a-b).map(j=>label(card.rows.flat()[j])).join(", ") : ""].join(" | "); });
  const text="Retour terrain\n#BADGES "+(T.t||"Q")+" "+(T.d||"")+"\n"+lines.join("\n");
  const missing=T.p.filter(r=>!(r[2]&&r[3].length)).length;
  if(missing && !confirmSend(missing)) return;
  if(navigator.share){ navigator.share({text}).catch(()=>window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")); }
  else window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}
function confirmSend(n){ return window.confirm(n+" personne(s) sans poste. Envoyer quand même ?"); }

function setAllProj(v){ ppl.forEach(p=>{ if(p.s.proj!==v){ p.s.proj=v; p.s.postes=[""]; } }); drawTable(); renderCards(); }
function setProj(i,v){ const s=ppl[i].s; s.proj=v; s.postes=[""]; drawRow(i); renderCards(); }
function setPoste(i,k,v){ const s=ppl[i].s; s.postes[k]=v;
  if(v!==""){ trainingsFor(s.proj,Number(v)).forEach(j=>{ if(!s.postes.includes(String(j))){ const e=s.postes.indexOf(""); if(e>=0) s.postes[e]=String(j); else s.postes.push(String(j)); } }); }
  drawRow(i); renderCards(); }
function addPoste(i){ ppl[i].s.postes.push(""); drawRow(i); }
function delPoste(i,k){ const s=ppl[i].s; s.postes.splice(k,1); if(!s.postes.length) s.postes=[""]; drawRow(i); renderCards(); }

function errOf(p){
  return !p.mat?"Matricule vide"
       : !/^\d+$/.test(p.mat)?"Matricule invalide (chiffres seulement)"
       : ppl.filter(q=>q.mat===p.mat).length>1?"Matricule en double"
       : !p.nom?"Nom vide" : !p.s.proj?"Choisir le projet"
       : !p.s.postes.some(Boolean)?"Choisir le poste" : !p.date?"Date manquante" : "";
}
function rowHTML(p){
  const card=CARDS[p.s.proj], i=p.idx, codes=card?card.rows.flat():[];
  const sels=p.s.postes.map((v,k)=>`<select onchange="setPoste(${i},${k},this.value)" ${card?"":"disabled"}>
      <option value="">— poste —</option>${codes.map((c,j)=>{const used=p.s.postes.includes(String(j))&&String(j)!==v;
        return used?"":`<option value="${j}" ${String(j)===v?"selected":""}>${esc(label(c))}</option>`}).join("")}</select>`
      +(p.s.postes.length>1?`<button class="sm" title="Enlever" onclick="delPoste(${i},${k})"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>`:"")).join("");
  const e=errOf(p);
  return `<td>${esc(p.mat)}</td><td>${esc(p.nom)}</td>
    <td><select onchange="setProj(${i},this.value)">${projOpts(p.s.proj)}</select></td>
    <td><div class="postes">${sels}${card?`<button class="sm" title="Ajouter un poste" onclick="addPoste(${i})">+</button>`:""}</div></td>
    <td>${e?`<span class="err">${e}</span>`:'<span class="ok">OK</span>'}</td>`;
}
function drawTable(){ try{ paintType(); }catch(e){}
  document.getElementById("list").innerHTML=ppl.map(p=>`<tr id="r${p.idx}" class="${errOf(p)?"badr":"okr"}">${rowHTML(p)}</tr>`).join(""); }
function drawRow(i){ const tr=document.getElementById("r"+i); if(tr){ tr.innerHTML=rowHTML(ppl[i]); tr.className=errOf(ppl[i])?"badr":"okr"; } }

const BADGE_LOGO='<svg viewBox="0 0 100 120" aria-label="Sulimet"><path fill="#e10012" d="M50 10 L93.3 35 L93.3 59 L50 34 L39.6 40 L93.3 71 L93.3 85 L50 110 L6.7 85 L6.7 61 L50 86 L60.4 80 L6.7 49 L6.7 35 Z"/><path fill="rgba(255,255,255,.16)" d="M50 10 L6.7 35 L6.7 49 L39.6 40 L50 34 Z"/></svg>';
function badge(p){
  const F=document.getElementById("ctype").value==="F";
  const card=CARDS[p.s.proj], on=new Set(p.s.postes.filter(Boolean).map(Number));
  let n=0;
  const grid=card.rows.map(row=>`<div class="n-grid" style="grid-template-columns:repeat(${card.cols},1fr)">`+
    row.map(c=>{const o=on.has(n++)?"on":"";return `<div class="n-item ${o}"><div class="n-lab">${esc(c)}</div><div class="n-sq ${o}"></div>${F?"":`<div class="n-ci ${o}"></div>`}</div>`}).join("")+`</div>`).join("");
  const nameSize=p.nom.length>32?6.4:p.nom.length>26?7.4:p.nom.length>21?8.2:9;
  const photo=(window.PHOTOS&&PHOTOS[p.mat])?`<img src="${PHOTOS[p.mat]}" alt="">`:`<span>PHOTO</span>`;
  return `<div class="badge${F?" form":""}">
    <div class="n-top"><div class="n-photo">${photo}</div>
      <div class="n-id">
        <div class="n-f"><span class="n-l">Matricule</span><span class="n-v mono">${esc(p.mat)}</span></div>
        <div class="n-f"><span class="n-l">Nom / Prénom</span><span class="n-v" style="font-size:${nameSize}pt">${esc(p.nom)}</span></div>
        <div class="n-f"><span class="n-l">Date d'expiration</span><span class="n-v mono">${fmt(p.date)}</span></div>
      </div>
      <div class="n-logo">${BADGE_LOGO}</div></div>
    ${F?`<div class="n-band">En cours de formation</div>`:""}
    <div class="n-line"></div>
    <div class="n-leg">${F?`<span><i class="n-sq on"></i>Formation</span>`:`<span><i class="n-sq on"></i>Aptitude</span><span><i class="n-ci on"></i>Formation</span>`}<b>${esc(p.s.proj)}</b></div>
    <div class="n-rows">${grid}</div>
    <div class="n-ref">${card.ref}</div></div>`;
}
// ---------- PDF: one A4 page per 8 badges ----------
const isPhone=()=>/Android|iPhone|iPad/i.test(navigator.userAgent);
async function buildPDF(){
  const pages=[...document.querySelectorAll("#cards .page")];
  if(!pages.length) throw {msg:"Aucun badge prêt."};
  if(!window.html2canvas||!window.jspdf) throw {msg:'Pas de connexion internet : utilisez "Imprimer directement" puis "Enregistrer en PDF".'};
  // copy the pages at real print size, off screen (the phone preview is resized)
  const box=document.createElement("div"); box.style.cssText="position:fixed;left:-10000px;top:0;background:#fff;width:200mm";
  document.body.appendChild(box);
  try{
    const pdf=new jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
    for(let i=0;i<pages.length;i++){
      const c=pages[i].cloneNode(true); c.style.zoom="1"; c.style.margin="0"; c.style.gridTemplateColumns="repeat(2,96mm)"; c.style.gridAutoRows="68mm"; c.style.gap="2mm";
      c.querySelectorAll(".badge").forEach(b=>{b.style.zoom="";b.style.boxShadow="none"}); box.innerHTML=""; box.appendChild(c);
      const canvas=await html2canvas(c,{scale:3,backgroundColor:"#ffffff"});
      const w=194, h=w*canvas.height/canvas.width;
      if(i) pdf.addPage();
      pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",(210-w)/2,8,w,h);
    }
    const d=new Date(), stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const name=`Badges_${stamp}.pdf`, blob=pdf.output("blob");
    return {blob,name,pages:pages.length,count:document.querySelectorAll("#cards .badge").length,file:new File([blob],name,{type:"application/pdf"})};
  } finally { box.remove(); }
}
function saveFile(o){ const a=document.createElement("a"); a.href=URL.createObjectURL(o.blob); a.download=o.name; document.body.appendChild(a); a.click(); a.remove(); }
async function pdfAction(kind){
  const msg=document.getElementById("pdfMsg"), btns=[...document.querySelectorAll(".pdfb")];
  btns.forEach(b=>b.disabled=true); msg.textContent="Création du PDF…";
  try{
    const o=await buildPDF();
    const text=`Badges de qualification : ${o.count} badge(s), ${o.pages} page(s) A4. Fichier ${o.name}`;
    if(kind==="download"){
      saveFile(o); msg.innerHTML=`<span class="ok">PDF téléchargé : ${o.name} (${o.pages} page(s)).</span>`;
    } else if(isPhone() && navigator.canShare && navigator.canShare({files:[o.file]})){
      // phone: the share menu opens, pick WhatsApp or the email app
      await navigator.share({files:[o.file],title:o.name,text}).catch(()=>{});
      msg.innerHTML=`<span class="ok">Choisissez ${kind==="whatsapp"?"WhatsApp":"votre application email"} dans le menu de partage.</span>`;
    } else {
      // PC: a browser cannot attach a file by itself, so the PDF is saved and the app opens ready to attach it
      saveFile(o);
      if(kind==="whatsapp"){ window.open("https://web.whatsapp.com/","_blank"); msg.innerHTML=`<span class="ok">PDF téléchargé (${o.name}). WhatsApp s'ouvre : choisissez le contact et joignez le fichier depuis Téléchargements.</span>`; }
      else { location.href="mailto:?subject="+encodeURIComponent("Badges de qualification — "+o.name.replace(/^Badges_|\.pdf$/g,""))+"&body="+encodeURIComponent("Bonjour,\n\nCi-joint les badges de qualification à imprimer ("+o.count+" badges, "+o.pages+" page(s) A4).\n\nMerci."); msg.innerHTML=`<span class="ok">PDF téléchargé (${o.name}). L'email s'ouvre : joignez le fichier depuis Téléchargements.</span>`; }
    }
  }catch(e){ msg.innerHTML=`<span class="err">${e&&e.msg?e.msg:'Erreur PDF. Utilisez "Imprimer directement".'}</span>`; }
  finally{ btns.forEach(b=>b.disabled=false); }
}

// ---------- Send the list (for the matrix) as a WhatsApp message ----------
function listText(){
  const ok=ppl.filter(p=>!errOf(p));
  const t=document.getElementById("ctype").value, d=document.getElementById("defDate").value;
  const lines=ok.map(p=>{ const card=CARDS[p.s.proj], all=card.rows.flat();
    const codes=p.s.postes.filter(Boolean).map(Number).sort((a,b)=>a-b).map(j=>label(all[j])).join(", ");
    return [p.mat,p.nom,p.s.proj,codes].join(" | "); });
  return {n:ok.length, text:"Retour terrain\n#BADGES "+t+" "+d+"\n"+lines.join("\n")};
}
// ===================== Ajouter à la matrice =====================
// Writes Matricule / Nom / Équipe into the first empty lines of "MP CORRIGÉ" (the lines are already
// formatted in the file), and adds every line to the sheet "Ajouts outil" (history with ticked boxes).
// Only the cells we fill are changed inside the file: charts, formulas, colours and other sheets stay as they are.
const MX_SHEET=/^MP CORRIG/i, LOG_NAME="Ajouts outil";
const xesc=t=>String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colNum=c=>c.split("").reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0);
const colLet=n=>{let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
const strCell=(ref,s,t)=>`<c r="${ref}"${s?` s="${s}"`:""} t="inlineStr"><is><t xml:space="preserve">${xesc(t)}</t></is></c>`;
const numCell=(ref,s,v)=>`<c r="${ref}"${s?` s="${s}"`:""}><v>${v}</v></c>`;
function relTarget(rels,id){ const m=rels.match(new RegExp(`<Relationship[^>]*Id="${id}"[^>]*>`)); if(!m) return null;
  let t=m[0].match(/Target="([^"]+)"/)[1]; return t.startsWith("/")?t.slice(1):"xl/"+t.replace(/^\.\//,""); }
function sharedStrings(xml){ if(!xml) return []; const out=[]; const re=/<si>([\s\S]*?)<\/si>/g; let m;
  while((m=re.exec(xml))) out.push([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join("")); return out; }
function cellsOf(rowXml){ const out={}; const re=/<c r="([A-Z]+)\d+"([^>]*?)(\/>|>([\s\S]*?)<\/c>)/g; let m;
  while((m=re.exec(rowXml))) out[m[1]]={xml:m[0],attrs:m[2],inner:m[4]||""}; return out; }
function cellText(c,ss){ if(!c) return ""; const v=c.inner.match(/<v>([\s\S]*?)<\/v>/); const is=c.inner.match(/<t[^>]*>([\s\S]*?)<\/t>/);
  if(/t="s"/.test(c.attrs)&&v) return ss[+v[1]]||""; if(is) return is[1]; return v?v[1]:""; }
function setCell(rowXml,ref,newCell){ const col=ref.match(/^[A-Z]+/)[0];
  const re=new RegExp(`<c r="${ref}"[^>]*?(\\/>|>[\\s\\S]*?<\\/c>)`); if(re.test(rowXml)) return rowXml.replace(re,newCell);
  // cell missing: insert it in column order
  const open=rowXml.match(/^<row[^>]*>/)[0]; let body=rowXml.slice(open.length,-6), done=false;
  body=body.replace(/<c r="([A-Z]+)\d+"/g,(all,c)=>{ if(!done&&colNum(c)>colNum(col)){done=true;return newCell+all;} return all; });
  if(!done) body+=newCell; return open+body+"</row>"; }

async function updateMatrixFile(buf, people, meta){
  const zip=await JSZip.loadAsync(buf);
  const wbXml=await zip.file("xl/workbook.xml").async("string");
  const rels=await zip.file("xl/_rels/workbook.xml.rels").async("string");
  const ss=sharedStrings(zip.file("xl/sharedStrings.xml")?await zip.file("xl/sharedStrings.xml").async("string"):"");
  const sheets=[...wbXml.matchAll(/<sheet [^>]*name="([^"]+)"[^>]*r:id="([^"]+)"[^>]*\/>/g)].map(m=>({name:m[1].replace(/&amp;/g,"&"),id:m[2]}));
  const mx=sheets.find(x=>MX_SHEET.test(x.name)); if(!mx) throw {msg:"Feuille « MP CORRIGÉ » introuvable dans ce fichier."};
  const mxPath=relTarget(rels,mx.id); let xml=await zip.file(mxPath).async("string");

  // read the list of operators (rows from 8 to the "Couverture" totals line)
  const rows={}; for(const m of xml.matchAll(/<row r="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g)) rows[+m[1]]=m[0];
  const nums=Object.keys(rows).map(Number).sort((a,b)=>a-b);
  let tot=null, last=7; const existing=new Set();
  for(const n of nums){ if(n<8) continue; const c=cellsOf(rows[n]); const b=cellText(c.B,ss).trim();
    if(/^Couverture/i.test(b)){ tot=n; break; }
    if(b){ last=n; existing.add(String(parseInt(b,10))); } }
  if(!tot) throw {msg:"Ligne des totaux « Couverture de l'activité » introuvable."};
  // empty, already formatted lines after the last operator (they must have the Matricule cell)
  const free=[]; for(let n=last+1;n<tot;n++){ const rx=rows[n]; if(rx && /<c r="B\d+"/.test(rx) && !cellText(cellsOf(rx).B,ss).trim() && !cellText(cellsOf(rx).C,ss).trim()) free.push(n); else break; }
  const toAdd=people.filter(p=>!existing.has(String(parseInt(p.mat,10))));
  const already=people.filter(p=>existing.has(String(parseInt(p.mat,10))));
  if(toAdd.length>free.length) throw {msg:`Il reste ${free.length} ligne(s) vide(s) dans la matrice, il en faut ${toAdd.length}. Dans Excel : clic droit sur la ligne ${last+1} → Insérer, pour ajouter des lignes vides avant les totaux. Rien n'a été modifié.`, need:true};
  toAdd.forEach((p,i)=>{ const n=free[i]; let rx=rows[n]; const c=cellsOf(rx);
    const sty=k=>{ const m=(c[k]?.attrs||"").match(/s="(\d+)"/); return m?m[1]:""; };
    rx=setCell(rx,"B"+n,numCell("B"+n,sty("B"),parseInt(p.mat,10)));
    rx=setCell(rx,"C"+n,strCell("C"+n,sty("C"),p.nom));
    rx=setCell(rx,"D"+n,strCell("D"+n,sty("D"),p.s.proj));
    xml=xml.replace(rows[n],rx); rows[n]=rx; });
  zip.file(mxPath,xml);

  // history sheet "Ajouts outil" (created the first time)
  const head=["Date ajout","Matricule","Nom & Prénom","Projet","Type de carte","Date expiration","Postes et formations cochés","Statut"];
  const lines=people.map(p=>{ const all=CARDS[p.s.proj].rows.flat();
    const codes=p.s.postes.filter(Boolean).map(Number).sort((a,b)=>a-b).map(j=>label(all[j])).join(", ");
    return [meta.today,p.mat,p.nom,p.s.proj,meta.type,meta.exp,codes,already.includes(p)?"Déjà dans la matrice":"Ajouté à la matrice"]; });
  const rowXml=(n,vals)=>`<row r="${n}">`+vals.map((v,j)=>j===1&&/^\d+$/.test(v)?numCell(colLet(j+1)+n,"",v):strCell(colLet(j+1)+n,"",v)).join("")+`</row>`;
  const lg=sheets.find(x=>x.name===LOG_NAME);
  if(lg){
    const lp=relTarget(rels,lg.id); let lx=await zip.file(lp).async("string");
    const lastRow=Math.max(0,...[...lx.matchAll(/<row r="(\d+)"/g)].map(m=>+m[1]));
    const add=lines.map((v,i)=>rowXml(lastRow+1+i,v)).join("");
    lx=/<sheetData\s*\/>/.test(lx)? lx.replace(/<sheetData\s*\/>/,`<sheetData>${add}</sheetData>`) : lx.replace("</sheetData>",add+"</sheetData>");
    zip.file(lp,lx);
  } else {
    const files=Object.keys(zip.files).filter(f=>/^xl\/worksheets\/sheet\d+\.xml$/.test(f)).map(f=>+f.match(/(\d+)\.xml/)[1]);
    const nf=Math.max(0,...files)+1, path=`xl/worksheets/sheet${nf}.xml`;
    const rid="rId"+(Math.max(0,...[...rels.matchAll(/Id="rId(\d+)"/g)].map(m=>+m[1]))+1);
    const sid=Math.max(0,...[...wbXml.matchAll(/sheetId="(\d+)"/g)].map(m=>+m[1]))+1;
    const widths=[12,11,30,9,24,15,45,22];
    const sheetXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rowXml(1,head)}${lines.map((v,i)=>rowXml(2+i,v)).join("")}</sheetData><pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/></worksheet>`;
    zip.file(path,sheetXml);
    zip.file("xl/workbook.xml",wbXml.replace("</sheets>",`<sheet name="${LOG_NAME}" sheetId="${sid}" r:id="${rid}"/></sheets>`));
    zip.file("xl/_rels/workbook.xml.rels",rels.replace("</Relationships>",`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${nf}.xml"/></Relationships>`));
    const ct=await zip.file("[Content_Types].xml").async("string");
    zip.file("[Content_Types].xml",ct.replace("</Types>",`<Override PartName="/${path}" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`));
  }
  // rebuild the package with files only (no folder entries), same order as before
  const pack=new JSZip();
  for(const name of Object.keys(zip.files)){ const f=zip.files[name]; if(f.dir) continue; pack.file(name, await f.async("uint8array"), {date:f.date, createFolders:false}); }
  const out=await pack.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  return {blob:out, added:toAdd, already, rows:toAdd.map((p,i)=>free[i]), left:free.length-toAdd.length};
}

// the matrix file is chosen once, then remembered (Edge / Chrome on PC)
const MXDB="sulimet_badges", MXKEY="matrice";
function idb(){ return new Promise((res,rej)=>{ const o=indexedDB.open(MXDB,1); o.onupgradeneeded=()=>o.result.createObjectStore("h"); o.onsuccess=()=>res(o.result); o.onerror=()=>rej(o.error); }); }
async function getHandle(){ try{ const d=await idb(); return await new Promise(r=>{ const q=d.transaction("h").objectStore("h").get(MXKEY); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }); }catch(e){ return null; } }
async function setHandle(h){ try{ const d=await idb(); d.transaction("h","readwrite").objectStore("h").put(h,MXKEY); }catch(e){} }
async function pickMatrix(){ const [h]=await window.showOpenFilePicker({types:[{description:"Matrice Excel",accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}]}); await setHandle(h); showMxFile(h); return h; }
async function showMxFile(h){ h=h||await getHandle(); const el=document.getElementById("mxFile"); if(!el) return;
  el.innerHTML= h? `Matrice : <b>${esc(h.name)}</b> · <a onclick="pickMatrix()">changer</a>` : ""; }
async function addToMatrix(){
  const msg=document.getElementById("pdfMsg"), btn=document.getElementById("mxBtn");
  if(!window.showOpenFilePicker||!window.JSZip){ msg.innerHTML='<span class="err">Ce bouton fonctionne dans Edge ou Chrome sur PC, avec internet.</span>'; return; }
  const ok=ppl.filter(p=>!errOf(p)); if(!ok.length){ msg.innerHTML='<span class="err">Aucune personne prête.</span>'; return; }
  btn.disabled=true;
  try{
    let h=await getHandle();
    if(h && (await h.queryPermission({mode:"readwrite"}))!=="granted" && (await h.requestPermission({mode:"readwrite"}))!=="granted") h=null;
    if(!h) h=await pickMatrix();
    if((await h.queryPermission({mode:"readwrite"}))!=="granted" && (await h.requestPermission({mode:"readwrite"}))!=="granted") throw {msg:"Autorisation refusée : la matrice n'a pas été modifiée."};
    msg.textContent="Ajout dans la matrice…";
    const t=document.getElementById("ctype").value;
    const meta={today:fmt(new Date()), type:t==="F"?"Formation en cours (1 mois)":"Qualification (1 an)", exp:fmt(parseDate(document.getElementById("defDate").value))};
    const res=await updateMatrixFile(await (await h.getFile()).arrayBuffer(), ok, meta);
    let w; try{ w=await h.createWritable(); }catch(e){ throw {msg:"La matrice est ouverte dans Excel : fermez-la, puis recliquez. Rien n'a été modifié."}; }
    await w.write(res.blob); await w.close();
    let txt=`${res.added.length} personne(s) ajoutée(s) dans « MP CORRIGÉ »`+(res.rows.length?` (lignes ${res.rows[0]} à ${res.rows[res.rows.length-1]})`:"")+`. Historique noté dans « ${LOG_NAME} ».`;
    if(res.already.length) txt+=` Déjà dans la matrice : ${res.already.map(p=>p.mat).join(", ")}.`;
    if(res.left<20) txt+=` Attention : plus que ${res.left} ligne(s) vide(s) dans la matrice.`;
    msg.innerHTML=`<span class="ok">${esc(txt)}</span>`;
  }catch(e){
    if(e&&e.name==="AbortError"){ msg.textContent=""; }
    else msg.innerHTML=`<span class="err">${esc(e&&e.msg?e.msg:"Erreur : la matrice n'a pas été modifiée. ("+(e&&e.message||e)+")")}</span>`;
  }finally{ btn.disabled=false; }
}
if(!window.showOpenFilePicker){ const b=document.getElementById("mxBtn"); if(b) b.style.display="none"; } else showMxFile();

function sendList(){
  const msg=document.getElementById("pdfMsg"), L=listText();
  if(!L.n){ msg.innerHTML='<span class="err">Aucune personne prête à envoyer.</span>'; return; }
  if(isPhone() && navigator.share){ navigator.share({text:L.text}).catch(()=>{}); }
  else window.open("https://wa.me/?text="+encodeURIComponent(L.text),"_blank");
  msg.innerHTML=`<span class="ok">Liste de ${L.n} personne(s) prête : choisissez le groupe WhatsApp.</span>`;
}

// Phone preview: scale each badge to the screen width (crisp, one per row)
function fitPreview(){
  const box=document.getElementById("cards"); if(!box) return;
  const narrow=window.matchMedia("(max-width:700px)").matches;
  const W=96*96/25.4;                                    // badge width in px
  const z=narrow? Math.min(1,(box.clientWidth-4)/W) : 1;
  box.querySelectorAll(".badge").forEach(b=>b.style.zoom= z===1?"":String(z));
}
window.addEventListener("resize",()=>fitPreview());

function renderCards(){
  const ok=ppl.filter(p=>!errOf(p)), bad=ppl.length-ok.length;
  const tn=document.getElementById("tbN"); if(tn){ tn.textContent=ppl.length; document.getElementById("tbOk").textContent=ok.length; document.getElementById("tbDate").textContent=new Date().toLocaleDateString("fr-FR"); }
  document.getElementById("status").innerHTML= ppl.length
    ? `<b>${ok.length}</b> / ${ppl.length} badge(s) prêt(s) → <b>${Math.ceil(ok.length/PER_PAGE)}</b> page(s)`+(bad?` — les lignes en rouge ne sont pas imprimées`:"")
    : "Collez d'abord Matricule + Nom.";
  const nP=Math.ceil(ok.length/PER_PAGE);
  let html=""; for(let i=0;i<ok.length;i+=PER_PAGE) html+=`<div class="plabel noprint">Page ${i/PER_PAGE+1} / ${nP}</div><div class="page">${ok.slice(i,i+PER_PAGE).map(badge).join("")}</div>`;
  document.getElementById("cards").innerHTML= html || `<div class="empty">Les badges apparaîtront ici.</div>`;
  fitPreview();
}

// Default expiry: qualification = +1 year, training = +1 month
function defaultDate(){ const d=new Date(); if(document.getElementById("ctype").value==="F") d.setMonth(d.getMonth()+1); else d.setFullYear(d.getFullYear()+1);
  document.getElementById("defDate").value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function setType(){ paintType(); defaultDate(); buildList(); }
function paintType(){ const t=document.getElementById("ctype"); t.closest(".typebox").classList.toggle("form",t.value==="F"); }
if(!startTerrain()){ defaultDate(); buildList(); paintType(); }
